<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#484f58"/>
      <stop offset="50%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Corpo da Bomba Injetora -->
  <rect x="220" y="120" width="170" height="130" rx="14" fill="url(#metal)" stroke="#30363d" stroke-width="3"/>
  <rect x="370" y="145" width="50" height="70" rx="8" fill="#30363d" stroke="#f59e0b" stroke-width="2"/>
  <!-- Tubulações de Alta Pressão -->
  <path d="M 250 120 L 250 80" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 280 120 L 280 70" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 310 120 L 310 70" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 340 120 L 340 80" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <!-- Polia de Acionamento -->
  <circle cx="190" cy="180" r="45" fill="#21262d" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="190" cy="180" r="18" fill="#484f58"/>
  <text x="300" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#c9d1d9" text-anchor="middle" letter-spacing="1">BOMBA INJETORA COMMON RAIL</text>
  <text x="300" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">SISTEMA DIESEL • ALTA PRESSÃO</text>
</svg>
