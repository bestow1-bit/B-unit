<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="canister" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f242c"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Filtro de Óleo Cartucho -->
  <rect x="220" y="80" width="160" height="200" rx="20" fill="url(#canister)" stroke="#f59e0b" stroke-width="3"/>
  <rect x="235" y="110" width="130" height="140" rx="8" fill="#21262d"/>
  <!-- Aletas do filtro -->
  <line x1="250" y1="120" x2="250" y2="240" stroke="#f59e0b" stroke-width="4"/>
  <line x1="270" y1="120" x2="270" y2="240" stroke="#f59e0b" stroke-width="4"/>
  <line x1="290" y1="120" x2="290" y2="240" stroke="#f59e0b" stroke-width="4"/>
  <line x1="310" y1="120" x2="310" y2="240" stroke="#f59e0b" stroke-width="4"/>
  <line x1="330" y1="120" x2="330" y2="240" stroke="#f59e0b" stroke-width="4"/>
  <line x1="350" y1="120" x2="350" y2="240" stroke="#f59e0b" stroke-width="4"/>
  <!-- Rosca / Base -->
  <ellipse cx="300" cy="80" rx="80" ry="16" fill="#484f58" stroke="#8b949e" stroke-width="2"/>
  <circle cx="300" cy="80" r="16" fill="#161b22"/>
  <text x="300" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#c9d1d9" text-anchor="middle" letter-spacing="1">KIT DE FILTROS ALTA EFICIÊNCIA</text>
  <text x="300" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">ÓLEO • AR • COMBUSTÍVEL</text>
</svg>
