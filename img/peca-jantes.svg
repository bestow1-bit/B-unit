<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Pneu exterior -->
  <circle cx="300" cy="180" r="130" fill="#0f172a" stroke="#1e293b" stroke-width="18"/>
  <!-- Jante exterior -->
  <circle cx="300" cy="180" r="105" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <!-- Raios da jante -->
  <line x1="300" y1="75" x2="300" y2="285" stroke="url(#rim)" stroke-width="18" stroke-linecap="round"/>
  <line x1="195" y1="180" x2="405" y2="180" stroke="url(#rim)" stroke-width="18" stroke-linecap="round"/>
  <line x1="225" y1="105" x2="375" y2="255" stroke="url(#rim)" stroke-width="18" stroke-linecap="round"/>
  <line x1="225" y1="255" x2="375" y2="105" stroke="url(#rim)" stroke-width="18" stroke-linecap="round"/>
  <!-- Cubo central -->
  <circle cx="300" cy="180" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="300" cy="180" r="16" fill="#f59e0b"/>
  <!-- Porcas da jante (6 furos) -->
  <circle cx="280" cy="165" r="4" fill="#cbd5e1"/>
  <circle cx="320" cy="165" r="4" fill="#cbd5e1"/>
  <circle cx="280" cy="195" r="4" fill="#cbd5e1"/>
  <circle cx="320" cy="195" r="4" fill="#cbd5e1"/>
  <text x="300" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#c9d1d9" text-anchor="middle" letter-spacing="1">JANTE ESPECIAL LIGA LEVE 17"</text>
  <text x="300" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">OFF-ROAD • FURAÇÃO 6x139.7</text>
</svg>
