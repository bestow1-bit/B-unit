      // 4. MODAL DE CONTACTO & WHATSAPP

          const cleanMsg = `*Contacto B-Unit (%20TVP)*%0A%0A*Nome:* ${encodeURIComponent(formData.name)}%0A*Telefone:* ${encodeURIComponent(formData.phone)}%0A*Mensagem:* ${encodeURIComponent(formData.message)}`;

                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    className="md:col-span-8 p-4 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-red-500"
                  />
                  <select
                    value={cat}
                    onChange={(e) => setCat(e.target.value)}
                    className="md:col-span-4 p-4 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white font-bold cursor-pointer"
                  >
                    {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>

              {filtered.length === 0 ? (
                <div className="bg-slate-900 p-12 rounded-3xl text-center border border-slate-800 space-y-4 max-w-2xl mx-auto">
                  <h3 className="text-xl font-bold font-serif text-white">Catálogo B-Unit</h3>
                  <p className="text-slate-300 text-sm">"Estamos a preparar o nosso catálogo. Não encontrou o que procura? Entre em contacto connosco e teremos todo o gosto em ajudar."</p>
                  <button onClick={() => onOpenContact()} className="px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl">ENTRAR EM CONTACTO</button>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {filtered.map((p) => (
                    <div key={p.id} className="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden flex flex-col justify-between group hover:border-red-600/50 transition-all">
                      <div className="h-48 bg-slate-950 overflow-hidden relative flex items-center justify-center p-3">
                        <img src={p.image} alt={p.name} className="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500" />
                        <span className="absolute top-2 left-2 px-2.5 py-1 bg-black/80 text-red-400 text-[10px] font-bold uppercase rounded border border-red-500/30">{p.category}</span>
                      </div>
                      <div className="p-5 space-y-3 flex-grow flex flex-col justify-between">
                        <div>
                          <h3 className="font-serif text-base font-bold text-white leading-snug">{p.name}</h3>
                          <p className="text-slate-400 text-xs mt-1 leading-relaxed">{p.description}</p>
                        </div>
                        <div className="pt-2 border-t border-slate-800">
                          <p className="text-[11px] text-slate-400 italic mb-2">Entre em contacto para saber a disponibilidade e obter uma cotação.</p>
                          <button onClick={() => onOpenContact(p)} className="w-full py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl">ENTRAR EM CONTACTO</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // 7. PÁGINA 3: TRANSPORTE ESCOLAR
      function SchoolTransportPage({ onOpenContact }) {
        const [formData, setFormData] = useState({
          name: '',
          phone: '',
          shift: 'Turno da Manhã',
          message: ''
        });

        const handleTransportSubmit = (e) => {
          e.preventDefault();
          const cleanMsg = `*Solicitação - Transporte Escolar B-Unit*%0A%0A*Encarregado:* ${encodeURIComponent(formData.name)}%0A*Telefone:* ${encodeURIComponent(formData.phone)}%0A*Escola:* ${encodeURIComponent(SCHOOL_NAME)}%0A*Turno:* ${encodeURIComponent(formData.shift)}%0A*Mensagem:* ${encodeURIComponent(formData.message || 'Solicito informações sobre o transporte escolar.')}`;
          window.open(`https://wa.me/${OFFICIAL_PHONE_RAW}?text=${cleanMsg}`, '_blank');
        };

        return (
          <div className="pt-28 pb-20 bg-[#FAFBFD] text-slate-800 min-h-screen space-y-12">
            <div className="max-w-7xl mx-auto px-4 space-y-12">
              
              {/* HERO */}
              <div className="bg-gradient-to-br from-slate-900 via-sky-950 to-slate-900 text-white rounded-3xl p-8 sm:p-12 shadow-2xl space-y-6">
                <span className="px-3.5 py-1 rounded-full bg-amber-500/20 text-amber-300 text-xs font-bold uppercase tracking-widest border border-amber-500/30">
                  TRANSPORTE ESCOLAR
                </span>
                <h1 className="font-serif text-3xl sm:text-4xl lg:text-5xl font-extrabold">
                  TRANSPORTE ESCOLAR <span className="text-amber-400">B-UNIT</span>
                </h1>
                <p className="text-slate-200 text-base sm:text-lg font-medium">
                  "Organização, responsabilidade e cuidado em cada viagem."
                </p>
                <div className="flex flex-wrap gap-3 text-xs font-bold pt-2">
                  <span className="px-3 py-1.5 rounded-lg bg-white/10 text-amber-300">Escola Atendida: <strong>{SCHOOL_NAME}</strong></span>
                  <span className="px-3 py-1.5 rounded-lg bg-white/10 text-sky-300">Zonas: <strong>{SCHOOL_ZONES.join(' • ')}</strong></span>
                  <a href={OFFICIAL_WHATSAPP_URL} target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 rounded-lg bg-emerald-950 text-emerald-300 border border-emerald-800">
                    WhatsApp: {OFFICIAL_PHONE_DISPLAY}
                  </a>
                </div>
              </div>

              {/* TURNOS */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-serif text-xl font-bold">TURNO DA MANHÃ</h3>
                    <span className="text-xs font-mono font-bold text-slate-500">20–23 crianças</span>
                  </div>
                  <div className="p-3 bg-amber-50 border border-amber-200 text-amber-900 rounded-xl text-center font-extrabold text-xs uppercase tracking-wider">
                    TURNO ATUALMENTE PREENCHIDO
                  </div>
                </div>

                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-serif text-xl font-bold">TURNO DA TARDE</h3>
                    <span className="text-xs font-mono font-bold text-slate-500">18–20 crianças</span>
                  </div>
                  <div className="p-3 bg-amber-50 border border-amber-200 text-amber-900 rounded-xl text-center font-extrabold text-xs uppercase tracking-wider">
                    TURNO ATUALMENTE PREENCHIDO
                  </div>
                </div>
              </div>

              {/* CARDS DE COMPROMISSO */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-2">
                  <h4 className="font-serif font-bold text-slate-900">SEGURANÇA</h4>
                  <p className="text-xs text-slate-600">"Prioridade durante cada viagem."</p>
                </div>
                <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-2">
                  <h4 className="font-serif font-bold text-slate-900">ORGANIZAÇÃO</h4>
                  <p className="text-xs text-slate-600">"Percursos e lugares organizados."</p>
                </div>
                <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-2">
                  <h4 className="font-serif font-bold text-slate-900">PONTUALIDADE</h4>
                  <p className="text-xs text-slate-600">"Compromisso com os horários."</p>
                </div>
                <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-2">
                  <h4 className="font-serif font-bold text-slate-900">RESPONSABILIDADE</h4>
                  <p className="text-xs text-slate-600">"Um serviço pensado para proporcionar tranquilidade aos encarregados de educação."</p>
                </div>
              </div>

              {/* GALERIA DA VIATURA */}
              <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
                <div className="border-b border-slate-100 pb-4">
                  <h3 className="font-serif text-2xl font-bold text-slate-900">Galeria da Viatura</h3>
                  <p className="text-xs text-slate-500">Fotografia da carrinha de transporte escolar</p>
                </div>

                <div className="max-w-2xl mx-auto">
                  <div className="h-72 sm:h-80 rounded-2xl overflow-hidden bg-slate-900 border border-slate-200 relative group shadow-md">
                    <img 
                      src={VAN_EXT_IMAGE} 
                      alt="Fotografia Exterior da Carrinha B-Unit" 
                      className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex flex-col justify-end p-4 text-white">
                      <span className="text-base font-bold">Viatura Escolar B-Unit</span>
                      <span className="text-xs text-slate-300">Exterior da carrinha pronta para os percursos</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* FORMULÁRIO */}
              <div className="bg-slate-900 text-white p-8 sm:p-12 rounded-3xl space-y-6 max-w-3xl mx-auto">
                <h3 className="font-serif text-2xl font-bold text-center">Solicitar Informações de Transporte</h3>
                <form onSubmit={handleTransportSubmit} className="space-y-4">
                  <input
                    type="text"
                    required
                    placeholder="Seu Nome"
                    value={formData.name}
                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                    className="w-full p-3 rounded-xl bg-slate-800 text-white text-sm"
                  />
                  <input
                    type="tel"
                    required
                    placeholder="Telefone de Contacto"
                    value={formData.phone}
                    onChange={(e) => setFormData({...formData, phone: e.target.value})}
                    className="w-full p-3 rounded-xl bg-slate-800 text-white text-sm font-mono"
                  />
                  <div className="grid grid-cols-2 gap-4">
                    <input type="text" disabled value={SCHOOL_NAME} className="p-3 rounded-xl bg-slate-700 text-amber-300 text-sm font-bold cursor-not-allowed" />
                    <select
                      value={formData.shift}
                      onChange={(e) => setFormData({...formData, shift: e.target.value})}
                      className="p-3 rounded-xl bg-slate-800 text-white text-sm"
                    >
                      <option value="Turno da Manhã">Turno da Manhã</option>
                      <option value="Turno da Tarde">Turno da Tarde</option>
                    </select>
                  </div>
                  <textarea
                    rows="3"
                    placeholder="Mensagem..."
                    value={formData.message}
                    onChange={(e) => setFormData({...formData, message: e.target.value})}
                    className="w-full p-3 rounded-xl bg-slate-800 text-white text-sm resize-none"
                  ></textarea>
                  <button type="submit" className="w-full py-3 bg-amber-500 text-slate-950 font-extrabold text-xs uppercase tracking-wider rounded-xl hover:bg-amber-400 transition-colors">
                    SOLICITAR INFORMAÇÕES VIA WHATSAPP
                  </button>
                </form>
              </div>

            </div>
          </div>
        );
      }

      // 8. COMPONENTE PRINCIPAL (APP)
      function App() {
        const [loading, setLoading] = useState(true);
        const [page, setPage] = useState('home');
        const [products] = useState(INITIAL_PRODUCTS);
        const [contactOpen, setContactOpen] = useState(false);
        const [selectedProduct, setSelectedProduct] = useState(null);

        const handleOpenProductContact = (product) => {
          setSelectedProduct(product || null);
          setContactOpen(true);
        };

        return (
          <div className="min-h-screen flex flex-col font-sans bg-[#08080a]">
            {loading && <LoadingScreen onFinish={() => setLoading(false)} />}

            <Navbar currentPage={page} onNavigate={setPage} onOpenContact={() => handleOpenProductContact(null)} />

            <main className="flex-grow">
              {page === 'home' && <HomePage onNavigate={setPage} onOpenContact={() => handleOpenProductContact(null)} />}
              {page === 'parts' && <AutoPartsPage products={products} onOpenContact={handleOpenProductContact} />}
              {page === 'transport' && <SchoolTransportPage onOpenContact={() => handleOpenProductContact(null)} />}
            </main>

            <ContactModal isOpen={contactOpen} onClose={() => setContactOpen(false)} targetProduct={selectedProduct} />

            <footer className="bg-black text-zinc-400 py-12 border-t border-zinc-900 text-center text-xs space-y-2">
              <p>Contacto WhatsApp / Chamadas: <strong className="text-white font-mono">{OFFICIAL_PHONE_DISPLAY}</strong></p>
              <p>© {new Date().getFullYear()} B-Unit — Todos os direitos reservados. "{BRAND_TAGLINE}."</p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
