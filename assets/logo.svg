<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="100%" height="100%" class="black-unit-official-logo">
  <defs>
    <!-- Solid Bright Red Gradient & Accents -->
    <linearGradient id="redGradPure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B80710"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="logoRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF1E27" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Pure Black Background as in Official Logo -->
  <rect width="100%" height="100%" fill="#000000" rx="20"/>

  <!-- Main Monogram Center Group (Serif Interlocking N, B, U, T) -->
  <g transform="translate(300, 240)" filter="url(#logoRedGlow)">
    
    <!-- Letter T Top Bar -->
    <path d="M -125 -115 H 125 V -84 H 70 V -115 H -70 V -84 H -125 Z" fill="url(#redGradPure)"/>

    <!-- Letter N Left Vertical Stem -->
    <rect x="-115" y="-115" width="38" height="230" rx="2" fill="url(#redGradPure)"/>
    <!-- Left Top & Bottom Serifs -->
    <path d="M -138 -115 H -70 V -98 H -138 Z M -138 98 H -70 V 115 H -138 Z" fill="url(#redGradPure)"/>

    <!-- Letter N Right Vertical Stem -->
    <rect x="77" y="-115" width="38" height="230" rx="2" fill="url(#redGradPure)"/>
    <!-- Right Top & Bottom Serifs -->
    <path d="M 56 -115 H 124 V -98 H 56 Z M 56 98 H 124 V 115 H 56 Z" fill="url(#redGradPure)"/>

    <!-- Letter N Diagonal Crossbar -->
    <path d="M -95 -115 L 95 100 H 115 V 115 L -75 -100 H -95 Z" fill="url(#redGradPure)"/>

    <!-- Nested Letter B (Lower Left inside N) -->
    <g transform="translate(-48, 20)">
      <path d="M -14 -40 H 16 C 32 -40, 42 -28, 42 -14 C 42 -2, 32 8, 14 10 C 34 14, 48 28, 48 46 C 48 64, 30 78, -14 78 H -34 V -40 H -14 Z M -12 -24 V -4 H 12 C 20 -4, 26 -9, 26 -14 C 26 -19, 20 -24, 12 -24 H -12 Z M -12 12 V 60 H 14 C 24 60, 30 54, 30 38 C 30 22, 24 12, 14 12 H -12 Z" 
            fill="url(#redGradPure)" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- Nested Letter U (Upper Right inside N) -->
    <g transform="translate(44, -68)">
      <path d="M -24 -36 H -2 V 20 C -2 38, 10 50, 26 50 C 42 50, 54 38, 54 20 V -36 H 76 V 20 C 76 54, 52 70, 26 70 C 0 70, -24 54, -24 20 V -36 Z" 
            fill="url(#redGradPure)" stroke="#000000" stroke-width="2"/>
    </g>

  </g>

  <!-- Serif Typography Text: BLACK UNIT -->
  <g transform="translate(300, 480)" text-anchor="middle" filter="url(#logoRedGlow)">
    <text x="0" y="0" 
          font-family="'Cinzel', 'Times New Roman', serif" 
          font-weight="900" 
          font-size="52" 
          letter-spacing="12" 
          fill="url(#redGradPure)">BLACK UNIT</text>
          
    <!-- Subtitle: B-UNIT – TVP -->
    <text x="0" y="36" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="700" 
          font-size="13" 
          letter-spacing="4" 
          fill="#00D2FF">B-UNIT – TVP – PEÇAS & TRANSPORTE ESCOLAR</text>
  </g>
</svg>
