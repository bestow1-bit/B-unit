<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0A0C10"/>
  <g transform="translate(250, 165)">
    <!-- Starter Main Electric Motor Cylinder -->
    <rect x="-120" y="-30" width="170" height="90" rx="12" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
    
    <!-- Solenoid Cylinder Top -->
    <rect x="-90" y="-85" width="110" height="50" rx="8" fill="#475569" stroke="#E50914" stroke-width="3"/>
    
    <!-- Pinion Nose Cone & Gear -->
    <path d="M 50 -40 L 130 -15 V 45 L 50 70 Z" fill="#1E293B" stroke="#00D2FF" stroke-width="3"/>
    <rect x="90" y="-5" width="25" height="40" rx="3" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="115" y1="15" x2="135" y2="15" stroke="#00D2FF" stroke-width="6"/>

    <!-- Electrical Terminal -->
    <circle cx="-60" cy="-60" r="10" fill="#E50914" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Label -->
  <text x="250" y="310" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="20" fill="#00D2FF">MOTOR DE ARRANQUE</text>
</svg>
