<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0A0C10"/>
  <g transform="translate(250, 160)">
    <!-- Alternator Main Body -->
    <circle cx="0" cy="0" r="90" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
    <circle cx="0" cy="0" r="70" fill="#1E293B" stroke="#00D2FF" stroke-width="2"/>
    
    <!-- Copper Stator Winding Lines -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#D97706" stroke-width="8" stroke-dasharray="12 6"/>
    
    <!-- Pulley Shaft & Wheel -->
    <circle cx="0" cy="0" r="32" fill="#64748B" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#0A0C10"/>

    <!-- Mounting Lugs -->
    <rect x="-125" y="-60" width="35" height="25" rx="6" fill="#475569" stroke="#94A3B8" stroke-width="2"/>
    <rect x="-125" y="40" width="35" height="25" rx="6" fill="#475569" stroke="#94A3B8" stroke-width="2"/>
    <rect x="90" y="20" width="35" height="30" rx="6" fill="#475569" stroke="#94A3B8" stroke-width="2"/>
  </g>
  <!-- Label -->
  <text x="250" y="310" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="20" fill="#00D2FF">ALTERNADOR</text>
</svg>
